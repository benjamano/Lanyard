name: CI
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Lanyard.App version bump
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          $csprojPath = 'src/Lanyard.Server/LanyardApp/Lanyard.App.csproj'
          $baseContent = git show "origin/${{ github.event.pull_request.base.ref }}:$csprojPath"
          $baseVersion = [regex]::Match($baseContent, '<Version>([^<]+)</Version>').Groups[1].Value
          $prContent = Get-Content $csprojPath -Raw
          $prVersion = [regex]::Match($prContent, '<Version>([^<]+)</Version>').Groups[1].Value

          Write-Host "Base version: $baseVersion"
          Write-Host "PR version:   $prVersion"

          if (-not $baseVersion -or -not $prVersion) {
            Write-Host "::error::Could not find <Version> in Lanyard.App.csproj on base or PR branch."
            exit 1
          }
          if ([version]$prVersion -le [version]$baseVersion) {
            Write-Host "::error::Lanyard.App.csproj <Version> must be incremented (base: $baseVersion, PR: $prVersion)."
            exit 1
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Uses LanyardApp.CI.slnf, not LanyardApp.sln: the filter excludes
      # Lanyard.Reach (a MAUI app targeting net10.0-maccatalyst, which only
      # builds on macOS). Everything else in the solution is included.
      - name: Restore
        run: dotnet restore LanyardApp.CI.slnf

      - name: Verify solution filter has no unexpected drift
        shell: pwsh
        run: |
          $slnProjects = dotnet sln LanyardApp.sln list | Select-Object -Skip 2 | ForEach-Object { $_.Trim() -replace '\\', '/' } | Where-Object { $_ -ne '' } | Sort-Object
          $slnfProjects = dotnet sln LanyardApp.CI.slnf list | Select-Object -Skip 2 | ForEach-Object { $_.Trim() -replace '\\', '/' } | Where-Object { $_ -ne '' } | Sort-Object
          $missing = Compare-Object -ReferenceObject $slnProjects -DifferenceObject $slnfProjects -PassThru | Where-Object { $_ -notlike '*Lanyard.Reach/Lanyard.Reach.csproj' }
          if ($missing) {
            Write-Host "Unexpected drift between LanyardApp.sln and LanyardApp.CI.slnf:"
            $missing | ForEach-Object { Write-Host "  $_" }
            Write-Host "If this is a new project, add it to LanyardApp.CI.slnf's projects list (unless it's macOS-only like Lanyard.Reach)."
            exit 1
          }
          Write-Host "No unexpected drift."

      - name: Build
        run: dotnet build LanyardApp.CI.slnf -c Release --no-restore

      - name: Test
        run: dotnet test src/Lanyard.Tests/Lanyard.Tests.csproj -c Release --no-build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f Dockerfile .
