# Signs a kiosk release that was published without a signature, so a kiosk on 1.0.44 or later can
# be pinned to it or roll back to it. Releases before 1.0.44 can still be signed this way, but a
# kiosk that moves back to one of them loses the signature check again.
name: Sign kiosk release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Kiosk version to sign, e.g. 1.0.44'
        required: true
jobs:
  sign:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the release feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path Releases | Out-Null
          gh release download "LanyardClient-${{ inputs.version }}" --pattern releases.win.json --dir Releases --clobber

      - name: Sign the package
        shell: pwsh
        env:
          CLIENT_RELEASE_SIGNING_KEY: ${{ secrets.CLIENT_RELEASE_SIGNING_KEY }}
        run: .github/scripts/sign-client-release.ps1 -FeedPath Releases/releases.win.json -Version ${{ inputs.version }} -OutDir Releases

      - name: Upload the package signature
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "LanyardClient-${{ inputs.version }}" (Get-ChildItem Releases/*.nupkg.sig).FullName --clobber
