name: Release
on:
  push:
    branches:
      - main
    paths:
      - 'src/Lanyard.Client/**'
      - 'src/Lanyard.Shared/**'
      - 'src/Lanyard.Infrastructure/**'
      - 'src/Lanyard.Tests/Client/**'
      - 'src/Lanyard.Client.Watchdog/**'
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write 
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Get version
        id: version
        run: |
          $xml = [xml](Get-Content src/Lanyard.Client/Lanyard.Client.csproj)
          $version = ($xml.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version.Trim()
          Write-Host "Resolved version: '$version'"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          $previousTag = git describe --tags --match "LanyardClient-*" --abbrev=0 2>$null
          $global:LASTEXITCODE = 0

          if ([string]::IsNullOrWhiteSpace($previousTag)) {
            Write-Host "No previous LanyardClient tag found, using full history"
            $range = "HEAD"
          }
          else {
            Write-Host "Previous tag: $previousTag"
            $range = "$previousTag..HEAD"
          }

          $commits = git log $range --no-merges --pretty=format:"- %s (%h)"
          if ([string]::IsNullOrWhiteSpace($commits)) {
            $commits = "- No changes recorded since the previous release."
          }

          $notes = "## What's Changed", ""
          $notes += $commits
          if (-not [string]::IsNullOrWhiteSpace($previousTag)) {
            $notes += ""
            $notes += "**Full changelog**: https://github.com/${{ github.repository }}/compare/$previousTag...LanyardClient-${{ steps.version.outputs.VERSION }}"
          }

          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          Get-Content release-notes.md

      - name: Publish app
        run: dotnet publish src/Lanyard.Client/Lanyard.Client.csproj -c Release -r win-x64 --self-contained -o ./publish

      - name: Package with Velopack
        run: vpk pack --packId LanyardClient --packVersion ${{ steps.version.outputs.VERSION }} --packDir ./publish --mainExe Lanyard.Client.exe --icon src/Lanyard.Client/favicon.ico --releaseNotes release-notes.md

      # Kiosks from 1.0.44 only install a package signed by this key (Lanyard.Shared.Updates.ReleaseSigning).
      # Fails without the secret, so an unsigned release can't go out.
      - name: Sign the package
        shell: pwsh
        env:
          CLIENT_RELEASE_SIGNING_KEY: ${{ secrets.CLIENT_RELEASE_SIGNING_KEY }}
        run: .github/scripts/sign-client-release.ps1 -FeedPath Releases/releases.win.json -Version ${{ steps.version.outputs.VERSION }} -OutDir Releases

      - name: Create and push tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "LanyardClient-${{ steps.version.outputs.VERSION }}"
          git push origin "LanyardClient-${{ steps.version.outputs.VERSION }}"

      # Kiosks on 1.0.41+ ask the Lanyard server which version to run, and the server treats a
      # prerelease as canary-only until a platform admin promotes it (Manage > Kiosk Releases).
      # Kiosks older than 1.0.41 take the newest non-prerelease GitHub release on their own, so
      # this stays off until they have all moved to 1.0.41 - then set the repository variable
      # CLIENT_RELEASES_AS_PRERELEASE to true (Settings > Secrets and variables > Actions).
      - name: Upload to GitHub Releases
        env:
          CLIENT_RELEASES_AS_PRERELEASE: ${{ vars.CLIENT_RELEASES_AS_PRERELEASE }}
        run: |
          $uploadArgs = @(
            'upload', 'github',
            '--repoUrl', 'https://github.com/${{ github.repository }}',
            '--token', '${{ secrets.GITHUB_TOKEN }}',
            '--tag', 'LanyardClient-${{ steps.version.outputs.VERSION }}',
            '--releaseName', 'Lanyard Client ${{ steps.version.outputs.VERSION }}',
            '--publish'
          )

          if ($env:CLIENT_RELEASES_AS_PRERELEASE -eq 'true') {
            Write-Host "Publishing as a prerelease: canary PCs only until promoted in Kiosk Releases"
            $uploadArgs += '--pre'
          }
          else {
            Write-Host "Publishing as a normal release: every PC on the Stable ring gets it"
          }

          vpk @uploadArgs

      # vpk only uploads Velopack's own files; the signature goes up next to the package.
      - name: Upload the package signature
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "LanyardClient-${{ steps.version.outputs.VERSION }}" (Get-ChildItem Releases/*.nupkg.sig).FullName --clobber
